name: remote-gpu-exp

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # - name: Check uv
      #   run: |
      #     which uv
      #     uv --version

      # - name: Setup uv environment
      #   working-directory: RecursiveMAS
      #   run: |
      #     export UV_CACHE_DIR="$HOME/.cache/uv"
      #     uv lock
      #     uv sync

      - name: Setup uv environment
        working-directory: RecursiveMAS
        run: |
          export UV_CACHE_DIR="$HOME/.cache/uv"
          uv lock
          uv sync --frozen

      - name: Prepare data
        run: |
          export DATA_ROOT="$HOME/datasets/world-collapse"
          export DATA_VERSION="${{ inputs.data_version }}"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HOME/hf_cache/datasets"
          export TRANSFORMERS_CACHE="$HOME/hf_cache/transformers"

      - name: Run EXP
        working-directory: RecursiveMAS
        run: |
          export DATA_ROOT="$HOME/datasets/world-collapse"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HOME/hf_cache/datasets"
          export TRANSFORMERS_CACHE="$HOME/hf_cache/transformers"

          uv run python inference/run.py \
                --style sequential_light \
                --dataset livecodebench \
                --device cuda
